# Локальная разработка Trello Team Analytics (Windows + Docker Desktop).
# Production через этот файл не разворачивается.

name: trello_analytics

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: trello_analytics_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trello}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trello_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-trello_analytics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trello_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  backend:
    build:
      context: ./trello_analytics_back
      dockerfile: Dockerfile
      target: development
    container_name: trello_analytics_backend
    restart: unless-stopped
    # Trello/app secrets: trello_analytics_back/.env
    # Compose/Postgres ports stay in workspace-root .env (variable substitution below).
    env_file:
      - ./trello_analytics_back/.env
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      # Always use Compose service hostname inside the network (overrides back/.env localhost).
      DATABASE_URL: ${DATABASE_URL:-postgres://trello:trello_dev_password@postgres:5432/trello_analytics?sslmode=disable}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./trello_analytics_back:/app
      - backend_go_mod_cache:/go/pkg/mod
      - backend_go_build_cache:/root/.cache/go-build
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trello_net
    stop_grace_period: 15s

  frontend:
    build:
      context: ./trello_analytics_front
      dockerfile: Dockerfile
      target: development
    container_name: trello_analytics_frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./trello_analytics_front:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    depends_on:
      - backend
    networks:
      - trello_net
    stop_grace_period: 10s

  # Одноразовые команды через scripts/dev.ps1:
  #   .\scripts\dev.ps1 migrate-up
  # Или вручную:
  #   docker compose --profile tools run --rm migrate
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://trello:trello_dev_password@postgres:5432/trello_analytics?sslmode=disable}
    volumes:
      - ./trello_analytics_back/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ['migrate -path=/migrations -database "$$DATABASE_URL" up']
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trello_net

networks:
  trello_net:
    name: trello_analytics_net
    driver: bridge

volumes:
  postgres_data:
    name: trello_analytics_postgres_data
  backend_go_mod_cache:
  backend_go_build_cache:
  frontend_node_modules:
